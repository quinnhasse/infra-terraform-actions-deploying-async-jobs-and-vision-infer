name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  contents: read
  id-token: write  # OIDC for AWS

env:
  TF_VERSION: "1.8.5"

jobs:
  # ── Detect which environment directories changed ──────────────────────────────
  changes:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            staging:
              - 'environments/staging/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  # ── Apply staging ─────────────────────────────────────────────────────────────
  apply-staging:
    name: Apply staging
    runs-on: ubuntu-latest
    environment: staging
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    defaults:
      run:
        working-directory: environments/staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -no-color

  # ── Apply prod (requires manual approval via GitHub environment) ───────────────
  apply-prod:
    name: Apply prod
    runs-on: ubuntu-latest
    environment: prod          # environment protection rules gate this job
    needs: [changes, apply-staging]
    if: needs.changes.outputs.prod == 'true'
    defaults:
      run:
        working-directory: environments/prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan (pre-apply confirmation)
        run: |
          terraform plan \
            -input=false \
            -no-color

      - name: terraform apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -no-color
